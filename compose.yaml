services:
  backend:
    build:
      context: .
    ports:
      - "8001:8000"
    environment:
      SQLITE_PATH: /data/db.sqlite3
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./pneumonia_frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8001
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data: